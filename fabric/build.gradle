plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

repositories {
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }

    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/releases/" }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    modImplementation "software.bernie.geckolib:geckolib-fabric-${minecraft_version}:${geckolib_version}"

    modApi("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}").exclude(group: "net.fabricmc.fabric-api")
    modApi "com.terraformersmc:modmenu:${modmenu_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version

    from(rootProject.file('LICENSE'))

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
    // Architectury 3.4.164 emits an unreferenced marker whose package embeds a
    // random project ID and absolute build path. It is not used by this repo
    // (no ExpectPlatform call sites), so keep it out of the shipping archive.
    exclude 'architectury_inject_*'
    exclude 'architectury_inject_*/**'
}

remapJar {
    input.set shadowJar.archiveFile
    doLast {
        def token = 'architectury_inject_'
        new java.util.zip.ZipFile(archiveFile.get().asFile).withCloseable { archive ->
            def entries = archive.entries()
            while (entries.hasMoreElements()) {
                def entry = entries.nextElement()
                if (entry.name.contains(token)) {
                    throw new GradleException(
                            "path-dependent Architectury injection entry survived: ${entry.name}")
                }
                if (!entry.directory) {
                    def payload = archive.getInputStream(entry).withCloseable { it.bytes }
                    if (new String(payload, java.nio.charset.StandardCharsets.ISO_8859_1)
                            .contains(token)) {
                        throw new GradleException(
                                "path-dependent Architectury injection reference survived: ${entry.name}")
                    }
                }
            }
        }
    }
}
