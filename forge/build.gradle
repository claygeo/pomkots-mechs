plugins {
    id 'com.github.johnrengelman.shadow'
}

loom {
    forge {
        mixinConfig "pomkotsmechs.mixins.json"
    }

    runs {
        gameTestServer {
            environment "gameTestServer"
            source sourceSets.main
            forgeTemplate "gameTestServer"
            name "Ashen Span Game Tests"
            runDir "run/gametest"
            property "forge.enableGameTest", "true"
            property "forge.gameTestServer", "true"
            property "forge.enabledGameTestNamespaces", "pomkotsmechs"
            // Loom 1.6 lower-cases custom environment names, but Forge's launch
            // config key is camel-cased. Override the DLI lookup key exactly.
            property "fabric.dli.env", "gameTestServer"
        }
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

// Release qualification is deliberately a second, unshipped Forge mod.  It
// compiles against the production module but is absent from main outputs,
// normal run configurations, remapJar, MRPack and server-overlay packaging.
sourceSets {
    qualification {
        java.setSrcDirs(['src/qualification/java'])
        resources.setSrcDirs(['src/qualification/resources'])
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    qualificationImplementation.extendsFrom implementation
    qualificationCompileOnly.extendsFrom compileOnly
    qualificationRuntimeOnly.extendsFrom runtimeOnly
}

repositories {
    flatDir {
        dirs 'libs'  // プロジェクト内のlibsフォルダを指定
    }

    maven { url "https://maven.shedaniel.me/" }
    maven { url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}


dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-forge:$rootProject.architectury_api_version"
    modImplementation "software.bernie.geckolib:geckolib-forge-${rootProject.minecraft_version}:${rootProject.geckolib_version}"

    modApi("me.shedaniel.cloth:cloth-config-forge:${cloth_config_version}")

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')


}

processResources {
    inputs.property 'version', project.version

    from(rootProject.file('LICENSE'))

    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}

// GameTest structures are compressed NBT, which is not representable as a text
// patch. Generate the one-block empty template from a fixed byte-level recipe so
// clean checkouts and offline builds receive identical namespaced test resources.
def generatedGameTestResources = layout.buildDirectory.dir("generated/gameTestResources")
def generatedEmptyGameTestStructure = generatedGameTestResources.map {
    it.file("data/pomkotsmechs/structures/gametest/empty.nbt")
}

tasks.register("generateGameTestStructure") {
    outputs.file(generatedEmptyGameTestStructure)
    doLast {
        File target = generatedEmptyGameTestStructure.get().asFile
        target.parentFile.mkdirs()
        target.withOutputStream { raw ->
            def data = new DataOutputStream(new java.util.zip.GZIPOutputStream(raw))
            data.writeByte(10) // root compound
            data.writeUTF("")

            data.writeByte(3)
            data.writeUTF("DataVersion")
            data.writeInt(3465) // Minecraft 1.20.1

            data.writeByte(9)
            data.writeUTF("size")
            data.writeByte(3)
            data.writeInt(3)
            data.writeInt(24)
            data.writeInt(2)
            data.writeInt(24)

            data.writeByte(9)
            data.writeUTF("palette")
            data.writeByte(10)
            data.writeInt(1)
            data.writeByte(8)
            data.writeUTF("Name")
            data.writeUTF("minecraft:air")
            data.writeByte(0)

            data.writeByte(9)
            data.writeUTF("blocks")
            data.writeByte(10)
            data.writeInt(1)
            data.writeByte(9)
            data.writeUTF("pos")
            data.writeByte(3)
            data.writeInt(3)
            data.writeInt(0)
            data.writeInt(0)
            data.writeInt(0)
            data.writeByte(3)
            data.writeUTF("state")
            data.writeInt(0)
            data.writeByte(0)

            data.writeByte(9)
            data.writeUTF("entities")
            data.writeByte(10)
            data.writeInt(0)
            data.writeByte(0)
            data.close()
        }
    }
}

sourceSets.main.resources.srcDir(generatedGameTestResources)
tasks.named("processResources").configure {
    dependsOn("generateGameTestStructure")
}
tasks.named("sourcesJar").configure {
    dependsOn("generateGameTestStructure")
}

tasks.named("runGameTestServer").configure {
    // Forge's dedicated GameTest server exits nonzero when any registered test
    // fails; preserve JavaExec's fail-fast behavior for the offlineCheck gate.
    ignoreExitValue = false
}

tasks.register("qualificationJar", Jar) {
    group = "verification"
    description = "Builds the unremapped, unshipped Ashen Span qualification probe."
    archiveBaseName = "ashen-span-qualification"
    archiveVersion = ""
    archiveClassifier = "dev"
    manifest {
        attributes("MixinConfigs": "ashen_span_qualification.mixins.json")
    }
    from sourceSets.qualification.output
    dependsOn tasks.named("qualificationClasses")
}

tasks.register("remapQualificationJar", net.fabricmc.loom.task.RemapJarTask) {
    group = "verification"
    description = "Remaps the unshipped Ashen Span qualification probe for Forge 1.20.1."
    inputFile.set(tasks.named("qualificationJar", Jar).flatMap { it.archiveFile })
    archiveBaseName.set("ashen-span-qualification")
    archiveVersion.set("")
    archiveClassifier.set("probe")
    addNestedDependencies.set(false)
}
